name: polynomial
version: 1
template: |
  You are generating math exercises for a student in a game.

  Generate exactly {total_exercises} factorization exercises.

  The server has already analyzed the player's performance for each factorization method.

  Method performance:

  {method_performance}

  You must follow this exercise plan exactly:

  {exercise_plan}

  Each entry in the exercise plan contains:

  method: the principal factorization method to practice
  difficulty: the required difficulty
  count: the exact number of exercises to generate
  category:
    focus: the method was relegated or remained at the same difficulty and requires more practice
    review: the method was promoted and should be reinforced

  Retrieved examples and structural descriptions:

  {examples}

  Analyze the mathematical structure of the retrieved examples.

  Generate NEW exercises that:

  follow similar factorization patterns,
  match similar structural complexity,
  preserve the same pedagogical difficulty,
  are NOT copies or minor coefficient changes.

  Difficulty guidelines:

  easy:

  single-step factoring
  small coefficients

  medium:

  larger coefficients
  mild structural complexity

  hard:

  multi-step factoring
  mixed methods
  larger exponents or coefficients

  very_hard:

  nested structures
  repeated factorization
  deceptive forms

  Requirements:

  Follow the method, difficulty, and count specified in the exercise plan
  Generate exactly the requested number of exercises for each method
  The total number of exercises must be exactly {total_exercises}
  Factorable over integers
  No substitution
  No synthetic division
  No factoring by grouping
  Higher difficulty should imply the mixing of two or more methods
  (example: common factor then inspection)
  Make sure that for perfect square trinomial and inspection the polynomials are returned in the order ax^2 + bx + c
  Don't generate exercises where you have to use perfect square trinomial and then difference of squares (leaving, for example,
  (x^2 - 4)^2).

  Topics:

  common_factor
  perfect_square_trinomial
  difference_of_squares
  inspection

  Inspection means finding two integers p and q such that:

  p + q equals the middle coefficient
  p·q equals the constant term

  Then writing the polynomial as:
  (x+p)(x+q)

  IMPORTANT:

  No markdown
  No explanations
  No LaTeX
  No code fences
  Return valid JSON only
  Each exercise must include the polynomial, its principal method, and its requested difficulty
  The method and difficulty must match the exercise plan

  Output format:

  [
  {{
  "polynomial": "x^2 + 5x + 6",
  "method": "inspection",
  "difficulty": "medium"
  }},
  {{
  "polynomial": "x^2 - 9",
  "method": "difference_of_squares",
  "difficulty": "easy"
  }},
  {{
  "polynomial": "3x^2 + 6x",
  "method": "common_factor",
  "difficulty": "easy"
  }}
  ]
