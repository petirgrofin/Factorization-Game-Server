name: polynomial
version: 1
template: |
  You are generating math exercises for a student in a game.

  Student profile:
  - Accuracy: {accuracy}
  - Average time: {avg_time} seconds
  - Weak topic: {topic}

  Generate THREE factorization exercises.

  Each mistake has the following meaning:

  - Original polynomial: the complete exercise originally presented to the player.
  - Current factorization: the expression remaining at the current step of the factorization process.
  - Selected factor: the specific polynomial the player attempted to factor.
  - Method used: the factorization method expected at this step.
  - Player inputs: the factor entered by the player.
  - Interpreted attempt: how the system interpreted the player's input.
  - Expanded attempt: the interpreted factorization after expansion.
  - Equivalent to selected factor: whether the expanded attempt is algebraically equivalent to the selected factor.
  - Diagnostic information: additional information about why the attempt succeeded or failed.

  The game is step-by-step.

  At each step, the player selects one factor of the current expression and applies a single factorization method.

  The mistake log describes one such step, not necessarily the entire original exercise.

  Recent player mistakes:

  {mistakes}

  Retrieved examples and structural descriptions:

  {examples}

  Analyze the mistake history to identify what the student struggles with.
  Analyze the mathematical structure of the retrieved examples. 

  Generate NEW exercises that:
  - follow similar factorization patterns,
  - match similar structural complexity,
  - preserve the same pedagogical difficulty,
  - are NOT copies or minor coefficient changes.

  Difficulty guidelines:

  easy:
  - single-step factoring
  - small coefficients

  medium:
  - larger coefficients
  - mild structural complexity

  hard:
  - multi-step factoring
  - mixed methods
  - larger exponents or coefficients

  very_hard:
  - nested structures
  - repeated factorization
  - deceptive forms

  Requirements:
  - Focus on the weak topic: {topic}
  - Difficulty: {difficulty}
  - Factorable over integers
  - No substitution
  - No synthetic division
  - No factoring by grouping 
  - Higher difficulty should imply the mixing of two or more methods
    (example: common factor then inspection)
  - Make sure that for perfect square trinomial and inspection the polynomials are returned in the order ax^2 + bx + c
  - Don't generate exercises where you have to use perfect square trinomial and then difference of squares (leaving, for example,
  (x^2 - 4)^2).

  Topics:
  - common_factor
  - perfect_square_trinomial
  - difference_of_squares
  - inspection

  Inspection means finding two integers p and q such that:
  - p + q equals the middle coefficient
  - p·q equals the constant term

  Then writing the polynomial as:
  (x+p)(x+q)

  IMPORTANT:
  - No markdown
  - No explanations
  - No LaTeX
  - No code fences

  Output format:

  [
    "x^2 + 5x + 6",
    "x^2 - 9",
    "3x^2 + 6x"
  ]