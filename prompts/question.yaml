name: question
version: 5
template: |
  You are generating adaptive math questions for a student.

  All text shown to the student must be in Spanish.
  Write all polynomials as plain text. Do not use LaTeX or fractions.

  ─────────────────────────────────────────
  STUDENT METHOD PERFORMANCE
  ─────────────────────────────────────────
  The following information describes the student's performance for each
  available factorization method:

  {method_performance}

  Use this information only as pedagogical context. The exercise plan below
  is the authoritative source for how many questions of each method and
  difficulty you must generate.

  ─────────────────────────────────────────
  EXERCISE PLAN — HARD CONSTRAINT
  ─────────────────────────────────────────
  You must generate questions according to this exact plan:

  {exercise_plan}

  Generate exactly {total_questions} questions in total.

  Each plan item contains:
  - "method": the factorization method being evaluated
  - "difficulty": the required difficulty
  - "count": the exact number of questions to generate
  - "category": the pedagogical purpose of those questions

  For every plan item, generate exactly its requested "count".

  The final number of questions for every method-difficulty combination must
  exactly match the exercise plan. Do not replace one requested method with
  another. Do not change any requested difficulty.

  Arrange the final questions in a mixed order. Do not place all questions
  from the same method consecutively.

  ─────────────────────────────────────────
  FACTORIZATION METHODS — STRICT LIST
  ─────────────────────────────────────────
  You may only use these method identifiers:

  - common_factor
  - difference_of_squares
  - perfect_square_trinomial
  - inspection

  Meaning of each identifier:

  1. common_factor
     Extract the greatest common numerical or monomial factor.

  2. difference_of_squares
     Use a^2 - b^2 = (a - b)(a + b).

  3. perfect_square_trinomial
     Recognize forms equivalent to:
     a^2 + 2ab + b^2
     a^2 - 2ab + b^2

  4. inspection
     Factor quadratic expressions by finding integer factor pairs.

  A question may require more than one step when its difficulty requires it.
  In that case, the "method" field must contain the principal method requested
  by the exercise plan.

  You must not use:
  - Sum or difference of cubes
  - Completing the square
  - Quadratic formula
  - Synthetic division
  - Factoring by grouping
  - Substitution
  - Any factorization method outside the strict list

  ─────────────────────────────────────────
  DIFFICULTY DEFINITIONS
  ─────────────────────────────────────────
  easy:
  - One direct step
  - One clearly recognizable method
  - Small integer coefficients
  - Minimal visual or algebraic distraction

  medium:
  - Requires structural recognition
  - May require one simple preliminary transformation
  - Moderate integer coefficients
  - The appropriate method is not immediately stated

  hard:
  - Requires multiple steps or a combination of allowed methods
  - May contain a disguised structure
  - Includes plausible intermediate errors
  - Requires checking whether the factorization is complete

  very_hard:
  - Requires at least two meaningful reasoning steps
  - Uses a nested or non-obvious structure
  - May combine allowed methods
  - Must not be a trivial one-step recognition question

  Every question must genuinely match the difficulty assigned to it in the
  exercise plan.

  ─────────────────────────────────────────
  ANSWER BALANCE — HARD CONSTRAINT
  ─────────────────────────────────────────
  Before writing any question, determine the answer for each slot.

  You must use exactly:
  - 5 questions whose "respuesta_correcta" is true
  - 5 questions whose "respuesta_correcta" is false

  Use a shuffled and non-grouped order. Do not put all affirmative or all
  negative answers together.

  Strategies for incorrect claims include:
  - A sign error
  - An incorrect exponent
  - A factorization that expands to a different polynomial
  - Claiming that a factorable polynomial is irreducible over the integers
  - Claiming that a non-factorable polynomial factors over the integers
  - Extracting a common factor that is not the greatest common factor
  - Omitting a variable from a common factor
  - Claiming that a partial factorization is complete
  - Using the correct method incorrectly
  - Presenting a plausible but invalid intermediate step

  Use several different error types.

  ─────────────────────────────────────────
  QUESTION STYLE — CONTEXTUAL PROBLEMS
  ─────────────────────────────────────────
  Most questions must be short problems embedded in a real, educational,
  geometric, or semi-real scenario.

  A question should present a situation, claim, procedure, comparison, or
  proposed solution for the student to evaluate.

  Possible formats include:
  - A student presents a factorization step
  - A teacher proposes a shortcut
  - A rectangle has an area represented by a polynomial
  - Two students compare different solutions
  - A student claims that a factorization is complete
  - A program displays a suggested factorization
  - A classmate identifies a particular factorization pattern
  - A construction or design problem uses polynomial dimensions
  - A student corrects one part of another student's work
  - A solution contains a partially extracted common factor

  Do not repeatedly use the same context.

  Avoid:
  - Context-free questions of the form
    "¿Es X factorizable como Y?"
  - Asking only whether an expression belongs to a named pattern
  - Questions that can be answered without checking the algebra
  - Reusing the same polynomial structure with different coefficients

  ─────────────────────────────────────────
  REQUIRED DIVERSITY
  ─────────────────────────────────────────
  Across the complete set:

  - Follow the method distribution in the exercise plan exactly
  - Follow the difficulty distribution in the exercise plan exactly
  - Do not use the same polynomial twice
  - Do not use the same structural pattern twice unless the plan makes it
    unavoidable
  - Use at least two variables other than x
  - Include multi-step questions whenever requested by hard or very_hard
    plan entries
  - Include leading coefficients other than 1
  - Do not reuse the same problem framing
  - Vary between correct solutions, incorrect solutions, partial solutions,
    comparisons, and claims about complete factorization

  ─────────────────────────────────────────
  OUTPUT FORMAT — STRICT
  ─────────────────────────────────────────
  Return only a raw JSON array.

  Do not use Markdown.
  Do not use code fences.
  Do not write explanations before or after the JSON.

  The output must have this structure:

  [
    {{
      "id": 1,
      "method": "common_factor",
      "difficulty": "easy",
      "contexto": "...",
      "pregunta": "...?",
      "respuesta_correcta": true,
      "explicacion": "..."
    }}
  ]

  Rules for each field:

  - "id":
    Integer from 1 to {total_questions}. IDs must be consecutive.

  - "method":
    Exactly one of:
    "common_factor",
    "difference_of_squares",
    "perfect_square_trinomial",
    "inspection"

    It must match one of the method slots requested by the exercise plan.

  - "difficulty":
    Exactly one of:
    "easy",
    "medium",
    "hard",
    "very_hard"

    It must match the difficulty associated with that method slot in the
    exercise plan.

  - "contexto":
    A short scenario, claim, process, or problem setup in Spanish.

  - "pregunta":
    A yes/no question in Spanish. It must always end with "?".

  - "respuesta_correcta":
    A JSON boolean:
    - true when the correct answer is Sí
    - false when the correct answer is No

  - "explicacion":
    A brief Spanish explanation that verifies the claim algebraically and
    states the correct factorization when appropriate.